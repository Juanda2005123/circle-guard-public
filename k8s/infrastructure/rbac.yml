# ============================================================
# CircleGuard — RBAC (ServiceAccount + Role + RoleBinding)
# Namespace  : ${NAMESPACE}
# Define una ServiceAccount de aplicación con permisos mínimos
# de lectura sobre recursos propios del namespace, usada por
# los 6 microservicios.
# Aplicar con: envsubst < rbac.yml | kubectl apply -f -
# ============================================================

apiVersion: v1
kind: ServiceAccount
metadata:
  name: circleguard-app
  namespace: ${NAMESPACE}
  labels:
    team: dream-team

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: circleguard-app-role
  namespace: ${NAMESPACE}
  labels:
    team: dream-team
rules:
  # Acceso de solo lectura a configuración/servicios del propio namespace
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: circleguard-app-binding
  namespace: ${NAMESPACE}
  labels:
    team: dream-team
subjects:
  - kind: ServiceAccount
    name: circleguard-app
    namespace: ${NAMESPACE}
roleRef:
  kind: Role
  name: circleguard-app-role
  apiGroup: rbac.authorization.k8s.io
